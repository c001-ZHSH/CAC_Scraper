name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pandas flask requests beautifulsoup4
        
    - name: Build with PyInstaller
      run: |
        pyinstaller --name "CAC_Scraper" --windowed --add-data "templates;templates" --add-data "static;static" app.py
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CAC_Scraper_Windows
        path: dist/CAC_Scraper
